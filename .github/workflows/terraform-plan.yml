name: terraform-plan

on:
  pull_request:
    paths:
      - "**.tf"
      - "domains/**.tfvars"
      - "backends/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-domains:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      CHECKPOINT_DISABLE: "1"
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get changed domain tfvars
        id: changed-domains
        uses: tj-actions/changed-files@2f7c5bfce28377bc069a65ba478de0a74aa0ca32 # v46.0.1
        with:
          files: domains/**/*.tfvars

      - name: Get changed shared Terraform files
        id: changed-shared
        uses: tj-actions/changed-files@2f7c5bfce28377bc069a65ba478de0a74aa0ca32 # v46.0.1
        with:
          files: |
            **/*.tf
            backends/**
            .github/workflows/terraform-plan.yml
          files_ignore: domains/**/*.tfvars

      - name: Build matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t all_domains < <(find domains -maxdepth 1 -type f -name '*.tfvars' -printf '%f\n' | sed 's/\.tfvars$//' | sort -u)
          if [[ ${#all_domains[@]} -eq 0 ]]; then
            echo 'matrix={"domain":[]}' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          selected_domains=()
          if [[ -n "${{ steps.changed-shared.outputs.all_changed_files }}" ]]; then
            selected_domains=("${all_domains[@]}")
          elif [[ -n "${{ steps.changed-domains.outputs.all_changed_files }}" ]]; then
            mapfile -t selected_domains < <(for f in ${{ steps.changed-domains.outputs.all_changed_files }}; do basename "$f" .tfvars; done | sort -u)
          fi

          if [[ ${#selected_domains[@]} -eq 0 ]]; then
            echo 'matrix={"domain":[]}' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json_domains=$(printf '%s\n' "${selected_domains[@]}" | jq -R . | jq -s -c .)
          matrix_json=$(jq -cn --argjson domains "$json_domains" '{domain:$domains}')
          echo "matrix=${matrix_json}" >> "$GITHUB_OUTPUT"
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"

  plan:
    needs: changed-domains
    if: needs.changed-domains.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      CHECKPOINT_DISABLE: "1"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changed-domains.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8

      - name: Setup reviewdog
        uses: reviewdog/action-setup@3f401fe1d58fe77e10d665ab713057375e39b887 # v1.3.0

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: terraform init -backend-config=backends/azure.tfvars

      - name: Terraform plan
        run: terraform plan -lock-timeout=5m -var-file="domains/${{ matrix.domain }}.tfvars" -out="plan-${{ matrix.domain }}.tfplan"

      - name: Upload plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfplan-${{ matrix.domain }}
          path: plan-${{ matrix.domain }}.tfplan

      - name: Slack/Teams notification placeholder
        if: always()
        run: echo "Integrate Slack/Teams notification here"

  no-changes:
    needs: changed-domains
    if: needs.changed-domains.outputs.has_changes == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No impacted domains detected."
