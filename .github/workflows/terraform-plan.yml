name: terraform-plan

on:
  pull_request:
    paths:
      - "**.tf"
      - "domains/**.tfvars"
      - "backends/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-domains:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46.0.1
        with:
          files: domains/**/*.tfvars

      - name: Build matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ steps.changed-files.outputs.all_changed_files }}" ]]; then
            echo 'matrix={"domain":[]}' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t domains < <(for f in ${{ steps.changed-files.outputs.all_changed_files }}; do basename "$f" .tfvars; done | sort -u)
          json_domains=$(printf '%s\n' "${domains[@]}" | jq -R . | jq -s .)
          echo "matrix={\"domain\":${json_domains}}" >> "$GITHUB_OUTPUT"
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"

  plan:
    needs: changed-domains
    if: needs.changed-domains.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changed-domains.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1.3.0

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: terraform init -backend-config=backends/azure.tfvars

      - name: Terraform plan
        run: terraform plan -lock-timeout=5m -var-file="domains/${{ matrix.domain }}.tfvars" -out="plan-${{ matrix.domain }}.tfplan"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.domain }}
          path: plan-${{ matrix.domain }}.tfplan

      - name: Slack/Teams notification placeholder
        if: always()
        run: echo "Integrate Slack/Teams notification here"

  no-changes:
    needs: changed-domains
    if: needs.changed-domains.outputs.has_changes == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No changed domain tfvars files detected."
